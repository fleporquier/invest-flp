# Configuration du module Opportunities Scanner.
seuils:
  baisse_5j_min: -5.0        # baisse 5 jours (%) en-dessous de laquelle on retient
  baisse_1m_min: -15.0       # baisse 1 mois (%) en-dessous de laquelle on retient
  market_cap_min_musd: 2000  # capitalisation minimale, en millions USD
  volume_ratio_min: 0.8      # ratio volume 5j / 20j minimal (liquidité)

universe:
  include_us_tech: true
  include_china: true
  include_etf: true

data:
  # Source des cours : "yfinance" (réseau ouvert requis), "cache" (lit les CSV
  # committés dans cache_dir), ou "auto" (essaie yfinance puis bascule sur le cache).
  # Dans l'environnement routine en liste blanche, Yahoo est bloqué -> "cache"
  # (alimenté par le workflow GitHub Actions refresh-prices.yml) : "auto" y
  # perd ~13s par ticker de l'univers (~127 tickers) en tentatives réseau
  # avant de retomber sur le cache, soit ~25-30 min gâchées pour rien.
  source: "cache"
  cache_dir: "data/prices"

claude:
  model: "claude-opus-5"
  max_tokens: 1000
  temperature: 0.2  # unused: the installed Anthropic SDK (>=1.x) dropped this param
  # Nécessite ANTHROPIC_API_KEY dans l'environnement. Absente dans l'environnement
  # routine actuel -> chaque candidat retombe sur le verdict fallback (ATTENDRE,
  # conviction 0) : le scan reste utile pour le screening technique/quantitatif
  # (baisse, RSI/MACD, éligibilité PEA) mais pas pour l'avis qualitatif Claude.

output:
  top_n: 15
  # "json" alimente le dashboard (sortie auto-redactee : pas de montants, pas de quantites).
  formats: ["console", "markdown", "excel", "json"]
  output_dir: "reports/"
